<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login</title>
<style>body{font-family:Arial;background:#f0f2f5;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:24px;border-radius:10px;width:min(360px,90vw);box-shadow:0 2px 12px #0002}input,button{width:100%;padding:12px;margin-top:10px;box-sizing:border-box}button{background:#1877f2;color:white;border:0;border-radius:5px}.err{color:#b00020}</style></head>
<body><div class="card"><h2>Admin dashboard</h2>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="err">{{ message }}</p>{% endfor %}{% endwith %}
<form method="post"><label>Admin password</label><input type="password" name="password" required><button type="submit">Log in</button></form></div></body></html>
