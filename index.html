<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0f2f5">

<title>Social Connect</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --blue: #1877f2;
  --background: #f0f2f5;
  --text: #1c1e21;
  --gray: #606770;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--text);
  min-height: 100vh;
}

main {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.layout {
  width: 100%;
  max-width: 980px;
  display: grid;
  grid-template-columns: 1fr 400px;
  align-items: center;
  gap: 65px;
}

.intro {
  padding-bottom: 35px;
}

.logo {
  color: var(--blue);
  font-size: 58px;
  font-weight: 750;
  letter-spacing: -2.5px;
  margin-bottom: 16px;
}

.intro p {
  font-size: 26px;
  line-height: 1.35;
  max-width: 440px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
  animation: appear 0.5s ease;
}

.card h2 {
  font-size: 24px;
  margin-bottom: 8px;
}

.description {
  color: var(--gray);
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 20px;
}

.field {
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 15px;
  font-size: 16px;
  border: 1px solid #ccd0d5;
  border-radius: 7px;
  outline: none;
  transition: 0.2s;
}

input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px #1877f21c;
}

button {
  border: none;
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.98);
}

.submit {
  width: 100%;
  padding: 14px;
  background: var(--blue);
  color: white;
  border-radius: 7px;
  font-size: 19px;
  font-weight: bold;
}

.submit:hover {
  background: #166fe5;
}

.divider {
  height: 1px;
  background: #dadde1;
  margin: 22px 0;
}

.create {
  display: block;
  margin: auto;
  padding: 13px 18px;
  background: #42b72a;
  color: white;
  border-radius: 7px;
  font-size: 15px;
  font-weight: bold;
}

.create:hover {
  background: #36a420;
}

#result {
  display: none;
  margin-top: 18px;
  padding: 20px;
  text-align: center;
  border-radius: 9px;
  background: #e7f7ec;
  color: #176534;
  animation: appear 0.4s ease;
}

#result .emoji {
  font-size: 42px;
  margin-bottom: 8px;
}

#result h3 {
  margin-bottom: 7px;
}

#result p {
  font-size: 14px;
  line-height: 1.5;
}

.note {
  font-size: 12px;
  color: var(--gray);
  text-align: center;
  margin-top: 18px;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: var(--gray);
  font-size: 12px;
  padding: 18px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 760px) {
  main {
    align-items: flex-start;
    padding: 35px 16px;
  }

  .layout {
    max-width: 420px;
    grid-template-columns: 1fr;
    gap: 25px;
  }

  .intro {
    text-align: center;
    padding-bottom: 0;
  }

  .logo {
    font-size: 48px;
  }

  .intro p {
    font-size: 19px;
    margin: auto;
  }

  .card {
    padding: 20px;
  }
}
</style>
</head>

<body>

<main>
  <div class="layout">

    <section class="intro">
      <div class="logo">social</div>

      <p>
        Connect with friends and the world around you.
      </p>
    </section>

    <section class="card">
      <h2>Welcome</h2>

      <p class="description">
        Enter your name and a fictional code to reveal a surprise.
      </p>

      <form id="form">

        <div class="field">
          <label for="name">Your name</label>
          <input
            id="name"
            name="full_name"
            type="text"
            placeholder="Your name"
            maxlength="80"
            autocomplete="name"
            required>
        </div>

        <div class="field">
          <label for="code">Fun code</label>
          <input
            id="code"
            name="prank_code"
            type="text"
            placeholder="Create a fictional code"
            maxlength="40"
            autocomplete="off"
            required>
        </div>

        <button class="submit" type="submit">
          Continue
        </button>

      </form>

      <div id="result" role="status" aria-live="polite">
        <div class="emoji">🎉</div>
        <h3>Surprise unlocked!</h3>
        <p id="message"></p>
      </div>

      <div class="divider"></div>

      <button class="create" id="surpriseButton" type="button">
        Reveal the surprise
      </button>

      <p class="note">
        An unofficial social-style experience.
        Not connected to Facebook.
      </p>
    </section>

  </div>
</main>

<footer>
  Social Connect · Made for fun
</footer>

<script>
const form = document.getElementById("form");
const result = document.getElementById("result");
const message = document.getElementById("message");
const surpriseButton = document.getElementById("surpriseButton");

function reveal(name) {
  message.textContent =
    "Hey " + name + "! You've unlocked the surprise. Have fun! 🎊";

  result.style.display = "block";
  result.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });
}

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("code").value.trim();

  if (!name || !code) {
    return;
  }

  reveal(name);
});

surpriseButton.addEventListener("click", function() {
  const name = document.getElementById("name").value.trim();

  reveal(name || "Friend");
});
</script>

</body>
</html>
