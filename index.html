<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1877f2">
<title>Connect</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#1877f2;
  --bg:#f0f2f5;
  --text:#1c1e21;
  --muted:#65676b;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  height:65px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  box-shadow:0 2px 8px #0000000d;
}

.logo{
  color:var(--blue);
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
}

.header-badge{
  background:#e7f3ff;
  color:#0866ff;
  padding:9px 15px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
}

main{
  max-width:1000px;
  min-height:calc(100vh - 110px);
  margin:auto;
  padding:40px 20px;
  display:grid;
  grid-template-columns:1fr 390px;
  align-items:center;
  gap:60px;
}

.hero h1{
  color:var(--blue);
  font-size:clamp(42px,6vw,65px);
  line-height:1.05;
  margin-bottom:20px;
  animation:fadeUp .7s ease;
}

.hero p{
  font-size:23px;
  line-height:1.5;
  max-width:440px;
  animation:fadeUp .9s ease;
}

.hero .tagline{
  display:inline-block;
  margin-top:24px;
  color:#0866ff;
  background:#e7f3ff;
  padding:10px 15px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 8px 28px #00000012;
  animation:fadeUp .6s ease;
}

.card h2{
  font-size:24px;
  margin-bottom:8px;
}

.subheading{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:22px;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ccd0d5;
  border-radius:8px;
  font-size:16px;
  outline:none;
  transition:.2s;
}

input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #1877f21c;
}

button{
  border:0;
  cursor:pointer;
  transition:transform .2s,background .2s;
}

button:active{
  transform:scale(.98);
}

.submit{
  width:100%;
  padding:15px;
  border-radius:8px;
  background:var(--blue);
  color:white;
  font-size:18px;
  font-weight:bold;
}

.submit:hover{
  background:#0866ff;
}

#result{
  display:none;
  margin-top:20px;
  padding:22px 15px;
  text-align:center;
  border-radius:12px;
  background:#e8f7ed;
  color:#176534;
  animation:fadeUp .4s ease;
}

#result .emoji{
  font-size:48px;
  margin-bottom:10px;
}

#result h3{
  font-size:22px;
  margin-bottom:8px;
}

#result p{
  font-size:14px;
  line-height:1.6;
}

footer{
  text-align:center;
  color:#65676b;
  font-size:12px;
  padding:18px;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:760px){
  header{padding:0 18px}
  main{
    grid-template-columns:1fr;
    gap:28px;
    padding:35px 16px;
    max-width:430px;
  }
  .hero{text-align:center}
  .hero h1{font-size:47px}
  .hero p{font-size:18px;margin:auto}
  .card{padding:21px}
}
</style>
</head>

<body>

<header>
  <div class="logo">Connect</div>
  <div class="header-badge">Let's connect ✨</div>
</header>

<main>

  <section class="hero">
    <h1>Connect<br>with friends.</h1>

    <p>
      A place to connect, share moments,
      and make every interaction memorable.
    </p>

    <div class="tagline">Your next surprise awaits ✨</div>
  </section>

  <section class="card">

    <h2>Join the fun</h2>

    <p class="subheading">
      Enter your name and create a fictional code
      to discover your surprise.
    </p>

    <form id="form">

      <div class="field">
        <label for="name">Your name</label>
        <input
          id="name"
          name="full_name"
          type="text"
          placeholder="Enter your name"
          maxlength="80"
          autocomplete="name"
          required>
      </div>

      <div class="field">
        <label for="code">Your fun code</label>
        <input
          id="code"
          name="prank_code"
          type="text"
          placeholder="Create any fictional code"
          maxlength="40"
          autocomplete="off"
          required>
      </div>

      <button class="submit" type="submit" id="submit">
        Discover Surprise
      </button>

    </form>

    <div id="result" role="status" aria-live="polite">
      <div class="emoji">🎉</div>
      <h3>Surprise!</h3>
      <p id="message"></p>
    </div>

  </section>

</main>

<footer>
  Connect · Made for fun
</footer>

<script>
/*
  Optional backend URL:
  Replace the empty string with your PythonAnywhere
  API endpoint after configuring the JSON API.
*/
const API_URL = "";

const form = document.getElementById("form");
const button = document.getElementById("submit");
const result = document.getElementById("result");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event){
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("code").value.trim();

  if(!name || !code){
    return;
  }

  button.disabled = true;
  button.textContent = "One moment...";

  try {
    if(API_URL){
      const response = await fetch(API_URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          full_name:name,
          prank_code:code
        })
      });

      const data = await response.json();

      if(!response.ok){
        throw new Error(data.message || "Could not submit.");
      }
    }

    message.textContent =
      "Hey " + name + "! You've unlocked your surprise. " +
      "Share a laugh with your friends! 🎊";

    result.style.display = "block";
    form.reset();

  } catch(error) {
    message.textContent =
      "The server is unavailable right now. Please try again later.";

    result.style.display = "block";
    result.style.background = "#fff0f0";
    result.style.color = "#a11b1b";

  } finally {
    button.disabled = false;
    button.textContent = "Discover Surprise";
  }
});
</script>

</body>
</html>
