<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f0f2f5">
<title>Social Connect</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
  min-height:100vh;
}
main{
  max-width:980px;
  min-height:100vh;
  margin:auto;
  padding:35px 20px;
  display:grid;
  grid-template-columns:1fr 390px;
  gap:55px;
  align-items:center;
}
.brand{
  color:#1877f2;
  font-size:56px;
  font-weight:750;
  letter-spacing:-2px;
  margin-bottom:16px;
}
.intro p{font-size:25px;line-height:1.4}
.card{
  background:white;
  padding:24px;
  border-radius:12px;
  box-shadow:0 5px 20px #00000015;
}
h2{font-size:24px;margin-bottom:9px}
.description{
  color:#65676b;
  font-size:14px;
  line-height:1.5;
  margin-bottom:20px;
}
label{
  display:block;
  font-weight:600;
  font-size:14px;
  margin-bottom:7px;
}
.field{margin-bottom:15px}
input{
  width:100%;
  padding:15px;
  border:1px solid #ccd0d5;
  border-radius:7px;
  font-size:16px;
  outline:none;
}
input:focus{
  border-color:#1877f2;
  box-shadow:0 0 0 2px #1877f21c;
}
button{
  width:100%;
  border:0;
  border-radius:7px;
  padding:14px;
  background:#1877f2;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.65}
#result{
  display:none;
  margin-top:18px;
  padding:20px;
  border-radius:9px;
  text-align:center;
  background:#e7f7ec;
  color:#176534;
}
#result h3{margin-bottom:8px}
#result p{font-size:14px;line-height:1.5}
footer{
  text-align:center;
  color:#65676b;
  padding:15px;
  font-size:12px;
}
@media(max-width:760px){
  main{
    max-width:430px;
    grid-template-columns:1fr;
    gap:25px;
    padding:35px 16px;
  }
  .intro{text-align:center}
  .brand{font-size:48px}
  .intro p{font-size:19px}
  .card{padding:20px}
}
</style>
</head>

<body>
<main>
  <section class="intro">
    <div class="brand">social</div>
    <p>Connect with friends and share memorable moments.</p>
  </section>

  <section class="card">
    <h2>Join the fun</h2>
    <p class="description">
      Enter your name and a fictional code to unlock a surprise.
    </p>

    <form id="form">
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" maxlength="80"
               placeholder="Enter your name"
               autocomplete="name" required>
      </div>

      <div class="field">
        <label for="code">Fictional code</label>
        <input id="code" maxlength="40"
               placeholder="Make up a code"
               autocomplete="off" required>
      </div>

      <button id="submit" type="submit">Continue</button>
    </form>

    <div id="result" role="status" aria-live="polite">
      <h3>🎉 Surprise unlocked!</h3>
      <p id="message"></p>
    </div>
  </section>
</main>

<footer>Social Connect · Made for fun</footer>

<script>
const API_URL = "https://j0x4m72.pythonanywhere.com/api/submit";

const form = document.getElementById("form");
const button = document.getElementById("submit");
const result = document.getElementById("result");

form.addEventListener("submit", async event => {
  event.preventDefault();

  const full_name = document.getElementById("name").value.trim();
  const prank_code = document.getElementById("code").value.trim();

  if (!full_name || !prank_code) return;

  button.disabled = true;
  button.textContent = "Submitting...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({full_name, prank_code})
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Submission failed.");
    }

    document.getElementById("message").textContent =
      `Hey ${full_name}! Your surprise is ready. 🎊`;

    result.style.display = "block";
    form.reset();

  } catch (error) {
    alert("Server connection failed. Check the backend URL and try again.");
  } finally {
    button.disabled = false;
    button.textContent = "Continue";
  }
});
</script>
</body>
</html>
